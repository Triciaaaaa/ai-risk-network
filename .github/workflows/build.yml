name: validate-and-build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validate.py
      - run: python build.py
      - name: commit rebuilt page (main only)
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "rebuild index.html"
          git push
