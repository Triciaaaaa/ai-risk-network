name: 删除请求 / Removal request
description: 请求删除本人或所代理对象的节点或关系 / Request removal of your own or represented record
title: "[Remove]: "
labels:
  - remove-request
body:
  - type: markdown
    attributes:
      value: |
        当事人或代理提出的删除请求会无条件处理，原因可以不填。请勿上传身份证明或其他私人材料。
        Removal requests from represented people or their agents are honoured without conditions. A reason is optional. Do not upload identity documents or other private material.
  - type: dropdown
    id: capacity
    attributes:
      label: 申请身份 / Requester capacity
      options:
        - 本人 / Represented person
        - 代理 / Agent
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 要删除的节点或关系 / Node or relation to remove
      description: 写节点名称，或明确列出要删除的关系 / Give the node name or list the specific relations
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 原因（可选）/ Reason (optional)
      description: 可以留空 / You may leave this blank
    validations:
      required: false
